name: Codex compatibility drift
on:
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * 1'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compare pinned tool sources with upstream
        run: node scripts/check-codex-compat.mjs main
